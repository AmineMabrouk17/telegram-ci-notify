# Reusable-workflow entry point.
#
# Call it from any repository instead of copying the action step yourself:
#
#   jobs:
#     notify:
#       uses: AmineMabrouk17/telegram-ci-notify/.github/workflows/notify.yml@v1
#       secrets: inherit
#
# `secrets: inherit` is enough — TELEGRAM_TOKEN and TELEGRAM_TO are passed
# through unchanged. You can also map them explicitly with a `secrets:` block.
#
# Note: the caller owns the `on:` triggers; this file only describes the job.
name: Telegram Notify (reusable)

on:
  workflow_call:
    inputs:
      project-name:
        description: Display name shown instead of owner/repo.
        type: string
        required: false
        default: ""
      chat-id:
        description: Override the TELEGRAM_TO secret for this call.
        type: string
        required: false
        default: ""
      silent:
        description: Send without a notification sound.
        type: boolean
        required: false
        default: false
    secrets:
      TELEGRAM_TOKEN:
        description: Bot token from @BotFather.
        required: false
      TELEGRAM_TO:
        description: Chat id that receives the messages.
        required: false

jobs:
  notify:
    name: Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: telegram-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: AmineMabrouk17/telegram-ci-notify@v1
        with:
          project-name: ${{ inputs.project-name }}
          chat-id: ${{ inputs.chat-id }}
          silent: ${{ inputs.silent }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
