name: Telegram CI Notify
description: >-
  Send one Telegram message summarising a GitHub event — push, pull request,
  review, comment, branch/tag, release — with buttons back to GitHub.
author: Amine Mabrouk
branding:
  icon: send
  color: blue

inputs:
  message:
    description: >-
      Text to send. Leave empty to auto-generate a summary of the current
      GitHub event. Plain text: `<`, `>` and `&` are escaped for you.
    required: false
    default: ""
  chat-id:
    description: >-
      Target chat id or @channel. Overrides the TELEGRAM_TO environment
      variable. Use this only for repos that notify more than one chat.
    required: false
    default: ""
  silent:
    description: >-
      auto (default) rings only when a pull request is opened or closed;
      true mutes everything; false rings for every event.
    required: false
    default: "auto"
  project-name:
    description: >-
      Friendly name shown instead of owner/repo (useful when one Telegram chat
      follows several repositories).
    required: false
    default: ""
  format:
    description: >-
      html (default) for bold headlines and monospace SHAs, plain to send
      the same text with no markup at all.
    required: false
    default: "html"
  preview-url:
    description: Exact preview URL for this pull request. Wins over preview-url-template.
    required: false
    default: ""
  preview-url-template:
    description: >-
      URL pattern for the Preview button, e.g.
      https://pr-{number}-my-worker.my-subdomain.workers.dev. Placeholders:
      {number}, {repo}, {branch}, {sha}, {actor}. No template, no button.
    required: false
    default: ""
  images-url-template:
    description: >-
      URL pattern for the Screenshots button, e.g.
      https://image.thum.io/get/width/1200/crop/900/{preview_url}. Also
      understands {preview_url}; needs a preview URL to resolve.
    required: false
    default: ""
  dry-run:
    description: Print the message and keyboard in the job log instead of sending.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Send Telegram message
      shell: bash
      env:
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_CHAT_ID: ${{ inputs.chat-id }}
        INPUT_SILENT: ${{ inputs.silent }}
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_PREVIEW_URL: ${{ inputs.preview-url }}
        INPUT_PREVIEW_URL_TEMPLATE: ${{ inputs.preview-url-template }}
        INPUT_IMAGES_URL_TEMPLATE: ${{ inputs.images-url-template }}
        NOTIFY_DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${{ github.action_path }}/scripts/notify.sh"
